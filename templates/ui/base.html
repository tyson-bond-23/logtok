<!DOCTYPE html>
<html lang="en" dir="ltr" x-data="app()">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>logtok</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    window.__i18n = {
    {%- for (key, val) in translations %}
      "{{ key }}": "{{ val }}"{% if !loop.last %},{% endif %}
    {%- endfor %}
    };
  </script>
  <script src="/static/app.js" defer></script>
  <script src="/static/alpine.min.js" defer></script>
  <script src="/static/htmx.min.js" defer></script>
</head>
<body class="bg-surface-900 text-zinc-100 font-sans antialiased min-h-screen"
      :class="theme === 'light' ? 'light-mode bg-surface-50 text-zinc-900' : 'bg-surface-900 text-zinc-100'">

  <!-- Top Navigation -->
  <nav class="fixed top-0 inset-x-0 z-50 border-b backdrop-blur-xl"
       :class="theme === 'light' ? 'bg-surface-50/80 border-zinc-200' : 'bg-surface-900/80 border-zinc-800'">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between h-14">

      <!-- Logo + Tabs -->
      <div class="flex items-center gap-1">
        <span class="font-bold text-lg tracking-tight mr-6"
              :class="theme === 'light' ? 'text-zinc-900' : 'text-white'">logtok</span>

        <template x-for="t_item in ['tokenize','detokenize','store','config','docs']" :key="t_item">
          <button class="px-3.5 py-1.5 text-sm font-medium rounded-lg transition-all duration-150"
                  :class="tab === t_item
                    ? (theme === 'light' ? 'bg-brand-500 text-white' : 'bg-brand-500/20 text-brand-400')
                    : (theme === 'light' ? 'text-zinc-500 hover:text-zinc-900 hover:bg-zinc-100' : 'text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800')"
                  @click="setTab(t_item)"
                  x-text="t['tab.' + t_item] || t_item.charAt(0).toUpperCase() + t_item.slice(1)">
          </button>
        </template>
      </div>

      <!-- Controls -->
      <div class="flex items-center gap-3">
        <button @click="toggleTheme()"
                class="w-8 h-8 flex items-center justify-center rounded-lg transition-colors"
                :class="theme === 'light' ? 'text-zinc-500 hover:bg-zinc-100' : 'text-zinc-400 hover:bg-zinc-800'">
          <template x-if="theme === 'dark'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </template>
          <template x-if="theme === 'light'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </template>
        </button>

        <button @click="showOnboarding = true; isNewVersion = true; showChangelog = true"
                class="text-[10px] font-mono px-1.5 py-0.5 rounded border cursor-pointer transition-colors"
                :class="theme === 'light' ? 'text-zinc-400 border-zinc-200 hover:border-brand-300 hover:text-brand-600' : 'text-zinc-600 border-zinc-800 hover:border-brand-500/50 hover:text-brand-400'"
                data-version="{{ version }}">v{{ version }}</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="pt-20 pb-12 px-4 sm:px-6 max-w-5xl mx-auto">

    <div x-show="tab === 'tokenize'" x-cloak x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 translate-y-1" x-transition:enter-end="opacity-100 translate-y-0">
      {% include "ui/tokenize.html" %}
    </div>

    <div x-show="tab === 'detokenize'" x-cloak x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 translate-y-1" x-transition:enter-end="opacity-100 translate-y-0">
      {% include "ui/detokenize.html" %}
    </div>

    <div x-show="tab === 'store'" x-cloak x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 translate-y-1" x-transition:enter-end="opacity-100 translate-y-0">
      {% include "ui/store.html" %}
    </div>

    <div x-show="tab === 'config'" x-cloak x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 translate-y-1" x-transition:enter-end="opacity-100 translate-y-0">
      {% include "ui/config.html" %}
    </div>

    <div x-show="tab === 'docs'" x-cloak x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 translate-y-1" x-transition:enter-end="opacity-100 translate-y-0">
      {% include "ui/docs.html" %}
    </div>

  </main>

  <!-- Toast notification banner -->
  <div x-show="toastVisible" x-transition:enter="transition ease-out duration-300"
       x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 translate-y-4"
       x-cloak
       class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 max-w-lg px-5 py-3 rounded-xl border shadow-lg backdrop-blur-xl text-sm font-medium flex items-center gap-3"
       :class="toastType === 'error'
         ? 'border-red-500/30 bg-red-500/10 text-red-400'
         : 'border-emerald-500/30 bg-emerald-500/10 text-emerald-400'">
    <template x-if="toastType === 'success'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    </template>
    <template x-if="toastType === 'error'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    </template>
    <span x-text="toast"></span>
    <button @click="toastVisible = false" class="ml-2 opacity-50 hover:opacity-100">&times;</button>
  </div>

  <!-- First-time onboarding overlay -->
  <div x-show="showOnboarding" x-cloak
       x-transition:enter="transition ease-out duration-300"
       x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-200"
       x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
       class="z-50 flex items-center justify-center p-4"
       style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);">
    <div class="w-full max-w-lg rounded-2xl border shadow-xl"
         style="padding: 2.5rem 2.5rem 2rem; max-height: 90vh; overflow-y: auto;"
         :class="theme === 'light' ? 'bg-white border-zinc-200' : 'bg-surface-800 border-zinc-700'"
         @click.outside="dismissOnboarding()">

      <!-- WELCOME VIEW (first visit) -->
      <template x-if="!isNewVersion && !showChangelog">
        <div>
          <div class="text-center" style="margin-bottom: 2rem;">
            <h2 class="text-2xl font-bold tracking-tight"
                style="margin-bottom: 0.5rem;"
                :class="theme === 'light' ? 'text-zinc-900' : 'text-white'">Welcome to logtok</h2>
            <p class="text-sm" :class="theme === 'light' ? 'text-zinc-500' : 'text-zinc-400'">
              Diagnose production logs safely in 3 steps
            </p>
          </div>

          <div style="display:flex;flex-direction:column;gap:0;">
            <!-- Step 1 -->
            <div class="flex items-start" style="gap:1rem;padding:1rem 0.75rem;border-radius:0.75rem;"
                 :class="theme === 'light' ? 'bg-zinc-50' : 'bg-brand-500/[0.04]'">
              <div class="flex-shrink-0 w-10 h-10 rounded-full bg-brand-500 flex items-center justify-center text-white font-bold" style="font-size:0.9375rem;">1</div>
              <div style="padding-top:0.125rem;">
                <p class="font-semibold" style="font-size:0.9375rem;" :class="theme === 'light' ? 'text-zinc-900' : 'text-zinc-100'">Tokenize</p>
                <p class="text-sm" style="margin-top:0.25rem;line-height:1.5;" :class="theme === 'light' ? 'text-zinc-500' : 'text-zinc-400'">
                  Paste or upload your raw logs. Sensitive data gets replaced with safe tokens like <code class="text-brand-400 text-xs font-mono">[IP_001]</code>.
                </p>
              </div>
            </div>
            <div class="flex justify-center" style="padding:0.25rem 0 0.25rem 0.5rem;">
              <svg width="20" height="24" viewBox="0 0 20 24" fill="none" :stroke="theme === 'light' ? '#a1a1aa' : '#948979'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 L10 18"/><path d="M5 14 L10 20 L15 14"/></svg>
            </div>
            <!-- Step 2 -->
            <div class="flex items-start" style="gap:1rem;padding:1rem 0.75rem;border-radius:0.75rem;">
              <div class="flex-shrink-0 w-10 h-10 rounded-full bg-brand-500/20 flex items-center justify-center text-brand-400 font-bold" style="font-size:0.9375rem;">2</div>
              <div style="padding-top:0.125rem;">
                <p class="font-semibold" style="font-size:0.9375rem;" :class="theme === 'light' ? 'text-zinc-900' : 'text-zinc-100'">Analyze with AI</p>
                <p class="text-sm" style="margin-top:0.25rem;line-height:1.5;" :class="theme === 'light' ? 'text-zinc-500' : 'text-zinc-400'">
                  Copy the tokenized output into Claude Code or any AI. It diagnoses errors without seeing your real secrets.
                </p>
              </div>
            </div>
            <div class="flex justify-center" style="padding:0.25rem 0 0.25rem 0.5rem;">
              <svg width="20" height="24" viewBox="0 0 20 24" fill="none" :stroke="theme === 'light' ? '#a1a1aa' : '#948979'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 L10 18"/><path d="M5 14 L10 20 L15 14"/></svg>
            </div>
            <!-- Step 3 -->
            <div class="flex items-start" style="gap:1rem;padding:1rem 0.75rem;border-radius:0.75rem;">
              <div class="flex-shrink-0 w-10 h-10 rounded-full bg-brand-500/20 flex items-center justify-center text-brand-400 font-bold" style="font-size:0.9375rem;">3</div>
              <div style="padding-top:0.125rem;">
                <p class="font-semibold" style="font-size:0.9375rem;" :class="theme === 'light' ? 'text-zinc-900' : 'text-zinc-100'">Detokenize</p>
                <p class="text-sm" style="margin-top:0.25rem;line-height:1.5;" :class="theme === 'light' ? 'text-zinc-500' : 'text-zinc-400'">
                  Paste the AI's response here. Tokens are replaced with real values for a clear, readable diagnosis.
                </p>
              </div>
            </div>
          </div>

          <button @click="dismissOnboarding()"
                  class="w-full bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2"
                  style="margin-top:1.75rem;padding:0.75rem 1.5rem;"
                  :class="theme === 'light' ? 'focus:ring-offset-white' : 'focus:ring-offset-surface-900'">
            Get Started
          </button>
        </div>
      </template>

      <!-- UPDATE VIEW (new version detected) -->
      <template x-if="isNewVersion && !showChangelog">
        <div>
          <div class="text-center" style="margin-bottom: 2rem;">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-500/20 text-brand-400 text-xs font-semibold" style="margin-bottom: 1rem;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>
              Updated to v{{ version }}
            </div>
            <h2 class="text-2xl font-bold tracking-tight"
                style="margin-bottom: 0.5rem;"
                :class="theme === 'light' ? 'text-zinc-900' : 'text-white'">logtok has been updated</h2>
            <p class="text-sm" :class="theme === 'light' ? 'text-zinc-500' : 'text-zinc-400'">
              New features and improvements are ready
            </p>
          </div>

          <div style="display:flex;flex-direction:column;gap:0.75rem;">
            <button @click="showChangelog = true"
                    class="w-full flex items-center justify-between rounded-xl border transition-colors"
                    style="padding:1rem 1.25rem;"
                    :class="theme === 'light' ? 'border-zinc-200 hover:border-brand-300 hover:bg-zinc-50' : 'border-zinc-700 hover:border-brand-500/50 hover:bg-brand-500/[0.04]'">
              <div class="flex items-center gap-3">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-brand-400"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                <span class="text-sm font-semibold" :class="theme === 'light' ? 'text-zinc-900' : 'text-zinc-100'">What's New?</span>
              </div>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" :class="theme === 'light' ? 'text-zinc-400' : 'text-zinc-500'"><polyline points="9 18 15 12 9 6"/></svg>
            </button>

            <button @click="dismissOnboarding()"
                    class="w-full bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2"
                    style="padding:0.75rem 1.5rem;"
                    :class="theme === 'light' ? 'focus:ring-offset-white' : 'focus:ring-offset-surface-900'">
              Continue
            </button>
          </div>
        </div>
      </template>

      <!-- CHANGELOG VIEW -->
      <template x-if="showChangelog">
        <div>
          <div style="margin-bottom: 1.5rem;">
            <button @click="showChangelog = false" class="flex items-center gap-1 text-xs font-medium transition-colors"
                    :class="theme === 'light' ? 'text-zinc-500 hover:text-zinc-900' : 'text-zinc-400 hover:text-zinc-100'">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
              Back
            </button>
            <h2 class="text-xl font-bold tracking-tight" style="margin-top:0.75rem;"
                :class="theme === 'light' ? 'text-zinc-900' : 'text-white'">What's New in v{{ version }}</h2>
          </div>

          <div style="display:flex;flex-direction:column;gap:1rem;">
            {% for change in changelog %}
            <div class="flex items-start" style="gap:0.75rem;">
              <div class="flex-shrink-0" style="margin-top:0.125rem;">
                {% if change.kind == "feat" %}
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-emerald-400"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>
                {% else %}
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-brand-400"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                {% endif %}
              </div>
              <div>
                <p class="text-sm font-medium" :class="theme === 'light' ? 'text-zinc-900' : 'text-zinc-100'">{{ change.title }}</p>
                <p class="text-xs" style="margin-top:0.125rem;" :class="theme === 'light' ? 'text-zinc-500' : 'text-zinc-400'">{{ change.description }}</p>
              </div>
            </div>
            {% endfor %}
          </div>

          <a href="https://github.com/tyson-bond-23/logtok" target="_blank" rel="noopener"
             class="flex items-center justify-center gap-2 w-full rounded-lg border text-sm font-medium transition-colors"
             style="margin-top:1.5rem;padding:0.625rem 1.5rem;"
             :class="theme === 'light' ? 'border-zinc-200 text-zinc-600 hover:border-zinc-300 hover:text-zinc-900' : 'border-zinc-700 text-zinc-400 hover:border-zinc-500 hover:text-zinc-200'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
            View on GitHub
          </a>

          <button @click="dismissOnboarding()"
                  class="w-full bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2"
                  style="margin-top:0.75rem;padding:0.75rem 1.5rem;"
                  :class="theme === 'light' ? 'focus:ring-offset-white' : 'focus:ring-offset-surface-900'">
            Got it
          </button>
        </div>
      </template>
    </div>
  </div>

</body>
</html>
