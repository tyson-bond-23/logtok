<div>
  <div class="mb-8">
    <h1 class="text-2xl font-bold tracking-tight" :class="theme === 'light' ? 'text-zinc-900' : 'text-white'" x-text="t['tab.tokenize'] || 'Tokenize'"></h1>
    <p class="mt-1 text-sm" :class="theme === 'light' ? 'text-zinc-500' : 'text-zinc-400'" x-text="t['label.paste_content'] || 'Replace sensitive data in your logs with safe tokens'"></p>
  </div>

  <form hx-post="/api/tokenize"
        hx-target="#tokenize-result"
        hx-encoding="multipart/form-data"
        hx-indicator="#tokenize-spinner"
        x-data="{ dragging: false, fileName: '', textFocused: false }">

    <div class="rounded-2xl border overflow-hidden transition-colors"
         :class="[
           dragging ? 'border-brand-500 ring-2 ring-brand-500/20' : '',
           theme === 'light' ? 'border-zinc-200 bg-surface-50' : 'border-zinc-800 bg-surface-800'
         ]"
         @dragover.prevent="dragging = true"
         @dragenter.prevent="dragging = true"
         @dragleave.prevent="dragging = false"
         @drop.prevent="
           dragging = false;
           const files = $event.dataTransfer.files;
           if (files.length > 0) {
             const input = $el.querySelector('input[type=file]');
             input.files = files;
             fileName = files[0].name;
             $el.closest('form').requestSubmit();
           }
         ">

      <textarea name="content"
                class="w-full border-0 px-5 py-4 text-[15px] font-mono leading-relaxed placeholder:text-zinc-500 focus:outline-none focus:ring-0 resize-y"
                :class="theme === 'light' ? 'text-zinc-800 bg-white' : 'text-zinc-200 bg-zinc-800/50'"
                :style="'transition: height 0.3s ease, padding 0.3s ease; overflow: hidden; height: ' + (fileName && !textFocused ? '2.5rem' : '18rem')"
                @focus="textFocused = true"
                @blur="if(!$el.value.trim()) textFocused = false"
                :placeholder="fileName && !textFocused ? 'Click to add text...' : (t['label.paste_content'] || 'Paste your log content here, or drag & drop a file...')"></textarea>

      <!-- File path input (D-18: 4th input method for large files -- server reads directly) -->
      <div class="flex items-center gap-2 px-5 py-3 border-t"
           :class="theme === 'light' ? 'border-zinc-100' : 'border-zinc-800/50'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0" :class="theme === 'light' ? 'text-zinc-400' : 'text-zinc-500'"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <input type="text" name="file_path"
               class="flex-1 bg-transparent text-sm font-mono placeholder:text-zinc-500 focus:outline-none"
               :class="theme === 'light' ? 'text-zinc-800' : 'text-zinc-200'"
               placeholder="Or enter file path (best for large files)..."
               @change="if($el.value) addRecentFile($el.value)">
      </div>

      <!-- D-25/UI-14: Recent files dropdown from localStorage -->
      <div x-show="recentFiles.length > 0" x-transition
           class="px-5 py-2 border-t"
           :class="theme === 'light' ? 'border-zinc-100 bg-zinc-50/50' : 'border-zinc-800/50 bg-surface-950/30'">
        <p class="text-[11px] font-medium uppercase tracking-wider mb-1.5"
           :class="theme === 'light' ? 'text-zinc-400' : 'text-zinc-600'"
           x-text="t['label.recent_files'] || 'Recent files'"></p>
        <div class="flex flex-wrap gap-1.5">
          <template x-for="rf in recentFiles.slice(0, 5)" :key="rf">
            <button type="button"
                    class="inline-flex items-center gap-1 px-2 py-0.5 text-xs font-mono rounded border transition-colors"
                    :class="theme === 'light'
                      ? 'border-zinc-200 text-zinc-600 hover:border-brand-300 hover:text-brand-600 bg-surface-50'
                      : 'border-zinc-700 text-zinc-400 hover:border-brand-500/50 hover:text-brand-400 bg-surface-800'"
                    @click="$el.closest('form').querySelector('[name=file_path]').value = rf"
                    x-text="rf.split(/[\\/]/).pop()">
            </button>
          </template>
        </div>
      </div>

      <div class="flex items-center justify-between px-5 py-3 border-t"
           :class="theme === 'light' ? 'border-zinc-100 bg-zinc-50' : 'border-zinc-800/50 bg-surface-900/50'">
        <div class="flex items-center gap-3">
          <label class="inline-flex items-center gap-2 px-3 py-1.5 text-xs font-medium rounded-lg border cursor-pointer transition-colors"
                 :class="theme === 'light' ? 'border-zinc-200 text-zinc-500 hover:border-zinc-300 hover:text-zinc-700' : 'border-zinc-700 text-zinc-400 hover:border-zinc-600 hover:text-zinc-300'">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload
            <input type="file" name="file" class="sr-only" @change="if($el.files.length>0){fileName=$el.files[0].name;$el.closest('form').requestSubmit()}">
          </label>
          <span x-show="fileName" class="inline-flex items-center gap-1.5 text-xs font-mono text-brand-400" x-transition>
            <span x-text="fileName"></span>
            <button type="button" @click.stop="fileName=''; textFocused=false; $el.closest('form').querySelector('input[type=file]').value=''"
                    class="inline-flex items-center justify-center w-4 h-4 rounded-full hover:bg-red-500/20 text-zinc-400 hover:text-red-400 transition-colors"
                    title="Remove file">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </span>
        </div>
        <button type="submit"
                class="px-6 py-2 text-white text-sm font-semibold rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2"
                style="background:linear-gradient(135deg,#6366f1,#4f46e5);transition:transform 0.15s ease,box-shadow 0.15s ease;"
                onmouseenter="this.style.transform='scale(1.03)';this.style.boxShadow='0 4px 12px rgba(99,102,241,0.35)'"
                onmouseleave="this.style.transform='scale(1)';this.style.boxShadow='none'"
                :class="theme === 'light' ? 'focus:ring-offset-white' : 'focus:ring-offset-surface-900'">
          Tokenize
        </button>
      </div>
    </div>
  </form>

  <div id="tokenize-spinner" class="htmx-indicator flex items-center gap-2 mt-4 text-sm text-zinc-400">
    <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>
    Processing...
  </div>

  <div id="tokenize-result" class="mt-4"></div>
</div>
