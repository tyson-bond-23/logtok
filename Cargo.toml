[package]
name = "logtok"
version = "0.2.6"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.102"
argon2 = "0.5.3"
askama = "0.15"
askama_web = { version = "0.15", features = ["axum-0.8"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
clap = { version = "4.6.0", features = ["derive", "color", "wrap_help"] }
hex = "0.4"
cli-clipboard = "0.4.0"
indicatif = "0.18.4"
mime_guess = "2"
open = "5"
rand = "0.9"
regex = "1.12.3"
rust-embed = "8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = "0.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
reqwest = { version = "0.12", features = ["blocking", "multipart"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
